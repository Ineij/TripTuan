services:
  - type: web
    name: triptuan
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: longcat
      - key: LLM_BASE_URL
        value: https://api.longcat.chat/openai
      - key: LLM_MODEL
        value: LongCat-2.0-Preview
      - key: LLM_API_KEY
        sync: false          # 在 Render 控制台手动填写
      - key: POSTER_IMAGE_PROVIDER
        value: qwen
      - key: POSTER_IMAGE_BASE_URL
        value: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      - key: POSTER_IMAGE_MODEL
        value: qwen-image-2.0-pro
      - key: POSTER_IMAGE_API_KEY
        sync: false
      - key: POSTER_IMAGE_SIZE
        value: "928*1664"
      - key: POSTER_IMAGE_TIMEOUT_SECONDS
        value: "60"
      - key: AMAP_API_KEY
        sync: false
      - key: AMAP_MAP_API_KEY
        sync: false
      - key: AMAP_WEATHER_API_KEY
        sync: false
      - key: AMAP_MAPMATCH_ENABLED
        value: "false"
      - key: CHECKIN_RADIUS_METERS
        value: "80"
      - key: CHECKIN_MIN_STAY_SECONDS
        value: "10"
      - key: TRIP_STATE_DB_PATH
        value: /tmp/travel_state.sqlite
